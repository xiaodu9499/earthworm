<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Earthworm 服务未启动</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.15), transparent 34%),
          radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.14), transparent 36%), #f8fafc;
      }

      main {
        width: min(640px, 100%);
        padding: 44px;
        border: 1px solid rgba(100, 116, 139, 0.2);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.12);
      }

      h1 {
        margin: 0 0 14px;
        font-size: 30px;
      }

      p {
        margin: 0 0 18px;
        color: #64748b;
        line-height: 1.7;
      }

      code {
        display: block;
        overflow-x: auto;
        margin: 22px 0;
        padding: 14px 16px;
        border-radius: 12px;
        color: #e2e8f0;
        background: #172033;
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
      }

      #retry {
        color: white;
        background: #7c3aed;
      }

      #browser {
        color: #334155;
        background: #e2e8f0;
      }

      #status {
        min-height: 24px;
        margin-top: 18px;
        color: #7c3aed;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        body {
          color: #e5e7eb;
          background: #0f172a;
        }

        body {
          background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.23), transparent 34%),
            radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.18), transparent 36%), #0f172a;
        }

        main {
          border-color: rgba(148, 163, 184, 0.18);
          background: rgba(15, 23, 42, 0.9);
        }

        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Earthworm 本地服务启动失败</h1>
      <p>独立版内置的课程服务或静态资源没有正常启动，不需要安装 Docker。</p>
      <p>请先重新连接；如果仍然失败，请退出并重新打开 Earthworm。</p>
      <div class="actions">
        <button
          id="retry"
          type="button"
        >
          重新连接
        </button>
        <button
          id="browser"
          type="button"
        >
          在浏览器中打开
        </button>
      </div>
      <p
        id="status"
        role="status"
      ></p>
    </main>
    <script>
      const retryButton = document.querySelector("#retry");
      const browserButton = document.querySelector("#browser");
      const status = document.querySelector("#status");

      retryButton.addEventListener("click", async () => {
        retryButton.disabled = true;
        status.textContent = "正在检查服务……";
        await window.earthwormDesktop.retry();
        retryButton.disabled = false;
        status.textContent = "仍未连接，请退出并重新打开 Earthworm。";
      });

      browserButton.addEventListener("click", () => window.earthwormDesktop.openBrowser());
    </script>
  </body>
</html>
